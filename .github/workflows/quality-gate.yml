name: quality-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: false

      - name: Install locked step 7 dependencies
        run: |
          python -m pip install -r requirements/step7.lock.txt
          python -m pip install --no-build-isolation --no-deps -e services/document-processor -e services/knowledge-service

      - name: Run the same gate used locally
        run: python tools/check.py ci
